<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@500&display=swap" rel="stylesheet">
    <link href="styles.css" rel="stylesheet" />
</head>

<body>
    <main class="login-box">
        <div class="logo">
            <svg viewBox="0 0 48 48" width="40" height="40">
                <path fill="#3964FE" fill-rule="evenodd" d="M33.2 6.3L34.0 6.6L35.7 9.4L38.3 10.9L39.1 12.5L41.1 11.4L45.2 10.8L47.4 9.1L48.0 9.8L47.8 12.5L46.5 15.2L44.3 17.3L40.3 18.8L38.8 26.2L33.8 34.2L34.1 35.0L37.9 36.6L38.1 37.6L37.0 38.5L34.7 38.8L30.1 38.0L26.3 40.5L21.6 41.7L13.3 41.1L9.0 39.2L4.4 35.1L1.5 30.6L0.1 26.3L0.1 19.2L2.1 14.6L6.5 10.1L11.8 8.3L17.8 8.7L22.1 7.1L25.0 7.1L25.5 7.9L24.0 9.2L24.1 10.9L31.5 17.8L35.3 19.6L35.7 17.7L33.0 14.7L31.9 11.8L31.9 9.0L33.1 6.3Z M5.1 19.1L10.7 20.0L15.5 22.6L19.4 26.1L23.3 31.9L28.1 37.2L24.7 37.1L16.6 31.8L15.3 32.5L16.2 35.2L15.5 36.3L12.2 35.8L9.4 33.7L6.8 30.8L4.1 25.5L3.3 19.7L5.0 19.2Z M26.4 20.5L29.4 22.1L31.6 26.1L30.0 26.8L28.1 25.7L27.4 22.5L25.1 21.4L26.3 20.6Z M25.5 23.0L26.1 23.6L25.5 23.8L25.4 23.1Z" />
            </svg>
            <span class="logo-name">deepseek</span>
        </div>

        <form class="login-form">
            <input type="text" name="account" placeholder="Phone number / email address" required>

            <div class="password-box">
                <input type="password" name="password" id="password" placeholder="Password" required>
                <button type="button" class="eye" id="eye">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                </button>
            </div>

            <p class="consent">
                By signing up or logging in, you consent to DeepSeek's
                <a href="https://cdn.deepseek.com/policies/en-US/deepseek-terms-of-use.html" target="_blank">Terms of Use</a> and <a href="https://cdn.deepseek.com/policies/en-US/deepseek-privacy-policy.html" target="_blank">Privacy Policy</a>.
            </p>

            <div class="form-links">
                <a href="https://chat.deepseek.com/sign_in">Forgot password?</a>
                <a href="https://chat.deepseek.com/sign_up">Sign up</a>
            </div>

            <button type="submit" class="login-btn">Log in</button>
        </form>

        <div class="other-login">
            <a href="https://chat.deepseek.com/sign_in">Log in with Google</a>
            <span class="bar">|</span>
            <a href="https://chat.deepseek.com/sign_in">Login with Apple</a>
        </div>
    </main>

    <footer>
        &#27993;ICP&#22791;2023025841&#21495; &middot; <a href="mailto:service@deepseek.com">Contact us</a>
    </footer>

    <script src="script.js"></script>
</body>

</html>
